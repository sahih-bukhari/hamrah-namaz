
name: Build and Deploy Hamrah Namaz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Find ZIP File
        id: zip
        run: |
          ZIP=$(find . -maxdepth 1 -name "hamrah-namaz-pro.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found!"
            exit 1
          fi
          echo "file=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Project ZIP
        run: |
          mkdir extracted
          unzip -q "${{ steps.zip.outputs.file }}" -d extracted

      - name: Find Project Directory
        id: project
        run: |
          PACKAGE=$(find extracted -name package.json -not -path "*/node_modules/*" -print -quit)
          if [ -z "$PACKAGE" ]; then
            echo "package.json not found!"
            exit 1
          fi
          DIR=$(dirname "$PACKAGE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Project
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run build

      - name: Verify Build
        run: |
          test -f "${{ steps.project.outputs.dir }}/dist/index.html"

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.project.outputs.dir }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
