
name: Build and Deploy Hamrah Namaz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify ZIP Archive
        run: |
          test -f hamrah-namaz-pro.zip
          unzip -t hamrah-namaz-pro.zip

      - name: Extract Project
        run: |
          mkdir -p site-source
          unzip -q hamrah-namaz-pro.zip -d site-source
          test -f site-source/package.json
          test -f site-source/package-lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-source/package-lock.json

      - name: Install Dependencies
        working-directory: site-source
        run: npm ci

      - name: Configure GitHub Pages Base Path
        working-directory: site-source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("vite.config.js")
          content = path.read_text(encoding="utf-8")

          old = "base: '/',"
          new = "base: '/hamrah-namaz/',"

          if new not in content:
              if old not in content:
                  raise SystemExit("Could not locate Vite base setting")
              content = content.replace(old, new, 1)

          path.write_text(content, encoding="utf-8")
          PY

      - name: Build Website
        working-directory: site-source
        run: npm run build

      - name: Verify Website Build
        run: |
          test -f site-source/dist/index.html
          test -d site-source/dist/assets
          echo "Website build verified successfully."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-source/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4

